name: Build Windows release

# Builds the Windows .exe and attaches a zip to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm bot-sivep-gripe.spec

      - name: Package zip
        run: |
          Compress-Archive -Path dist/bot-sivep-gripe/* -DestinationPath bot-sivep-gripe-windows.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-sivep-gripe-windows
          path: bot-sivep-gripe-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bot-sivep-gripe-windows.zip

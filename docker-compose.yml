version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kestra-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5

  kestra:
    image: kestra/kestra:latest
    container_name: kestra-server
    pull_policy: always
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /app/kestra server standalone --flow-path=/app/flows
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra123
        kestra:
          server:
            basicAuth:
              enabled: false
    ports:
      - "8080:8080"
    volumes:
      - ./kestra:/app/flows
      - ./downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
